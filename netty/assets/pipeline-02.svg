<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title description"><title id="title">Propagate an event across handler contexts</title><desc id="description">XXX stands for an event such as Read or Registered; the source has concrete methods for each event.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="780" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">NETTY 4.1.53.FINAL</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Propagate an event across handler contexts</text>
<rect x="42" y="135" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="165" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">01  Pipeline starts the event</text>
<text x="63" y="192" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">fireChannelXXX delegates to the head context.</text>
<path d="M 500 217 L 500 239" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="244" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="274" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">02  Find the next context</text>
<text x="63" y="301" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">findContextInbound / findContextOutbound follows the required direction.</text>
<path d="M 500 326 L 500 348" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="353" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="383" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">03  Invoke the handler</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">invokeChannelXXX calls handler.channelXXX(ctx, ...).</text>
<path d="M 500 435 L 500 457" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="462" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="492" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">04  Handler continues propagation</text>
<text x="63" y="519" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">ctx.fireChannelXXX locates and invokes the next interested context.</text>
<path d="M 500 544 L 500 566" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="571" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="601" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">05  Repeat</text>
<text x="63" y="628" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Propagation continues only when the handler forwards the event.</text>
<text x="34" y="694" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">XXX stands for an event such as Read or Registered; the source has concrete methods for each event.</text>
<a href="https://github.com/netty/netty/blob/d4a0050ef33cab2542a80e11489a4977a63859f8/transport/src/main/java/io/netty/channel/AbstractChannelHandlerContext.java">
<text x="34" y="758" font-size="13" fill="#2161ad" font-weight="400" text-anchor="start">Source: AbstractChannelHandlerContext.java • Netty 4.1.53.Final</text>
</a></g></svg>
