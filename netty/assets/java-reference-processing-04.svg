<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">From the GC to your ReferenceQueue</title><desc id="d">OpenJDK 8: the JVM builds the pending list; the Reference Handler thread empties it one reference at a time.</desc><defs><marker id="a-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="a-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/></marker><marker id="a-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="a-bc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/></marker><marker id="a-59636e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/></marker><marker id="a-d1d9e0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d9e0"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="32.0" y="40.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">From the GC to your ReferenceQueue</text>
<text x="32.0" y="64.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">OpenJDK 8: the JVM builds the pending list; the Reference Handler thread empties it one reference at a time.</text>
<rect x="40.0" y="100.0" width="230.0" height="92.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="40.0" y="100.0" width="4" height="92.0" rx="2" fill="#59636e"/>
<text x="56.0" y="122.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#59636e" font-weight="600" text-anchor="start">GC (JVM)</text>
<text x="56.0" y="144.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">discovers soft / weak /</text>
<text x="56.0" y="163.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">phantom references whose</text>
<text x="56.0" y="182.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">referent became unreachable</text>
<rect x="330.0" y="100.0" width="300.0" height="92.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="330.0" y="100.0" width="4" height="92.0" rx="2" fill="#bc4c00"/>
<text x="346.0" y="122.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#bc4c00" font-weight="600" text-anchor="start">Reference.pending</text>
<text x="346.0" y="144.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">head of the pending list</text>
<text x="346.0" y="163.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">next ones linked via .discovered</text>
<text x="346.0" y="182.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">guarded by Reference.lock</text>
<rect x="330.0" y="240.0" width="300.0" height="92.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="330.0" y="240.0" width="4" height="92.0" rx="2" fill="#0969da"/>
<text x="346.0" y="262.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#0969da" font-weight="600" text-anchor="start">Reference Handler thread</text>
<text x="346.0" y="284.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">loop: tryHandlePending(true)</text>
<text x="346.0" y="303.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">take one r, unlink it</text>
<text x="346.0" y="322.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">wait() when the list is empty</text>
<rect x="690.0" y="100.0" width="240.0" height="76.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="690.0" y="100.0" width="4" height="76.0" rx="2" fill="#8250df"/>
<text x="706.0" y="122.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8250df" font-weight="600" text-anchor="start">Cleaner</text>
<text x="706.0" y="144.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">c.clean() — e.g. frees</text>
<text x="706.0" y="163.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">DirectByteBuffer memory</text>
<rect x="690.0" y="220.0" width="240.0" height="76.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="690.0" y="220.0" width="4" height="76.0" rx="2" fill="#1a7f37"/>
<text x="706.0" y="242.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1a7f37" font-weight="600" text-anchor="start">ReferenceQueue</text>
<text x="706.0" y="264.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">q.enqueue(r)</text>
<text x="706.0" y="283.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">if r.queue != NULL</text>
<rect x="690.0" y="340.0" width="240.0" height="76.0" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="690.0" y="340.0" width="4" height="76.0" rx="2" fill="#1a7f37"/>
<text x="706.0" y="362.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1a7f37" font-weight="600" text-anchor="start">application</text>
<text x="706.0" y="384.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">queue.poll() / remove()</text>
<text x="706.0" y="403.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">gets the Reference object</text>
<path d="M 270.0 146.0 L 330.0 146.0" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#a-59636e)"/>
<text x="300.0" y="138.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="500" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">fills</text>
<path d="M 480.0 192.0 L 480.0 240.0" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#a-bc4c00)"/>
<text x="480.0" y="220.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#bc4c00" font-weight="500" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">take head</text>
<path d="M 630.0 266.0 L 660.0 266.0 L 660.0 138.0 L 690.0 138.0" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a-8250df)"/>
<text x="642.0" y="196.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8250df" font-weight="600" text-anchor="end">Cleaner?</text>
<path d="M 630.0 268.0 L 690.0 268.0" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#a-1a7f37)"/>
<text x="642.0" y="300.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a7f37" font-weight="600" text-anchor="end">otherwise</text>
<path d="M 810.0 296.0 L 810.0 340.0" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#a-1a7f37)"/>
<text x="40.0" y="400.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">With no queue (ReferenceQueue.NULL) the reference is simply dropped.</text>
<text x="40.0" y="420.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">Cleared or enqueued does not mean the memory is already reclaimed.</text></svg>
