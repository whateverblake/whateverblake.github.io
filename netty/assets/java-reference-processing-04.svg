<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="889" viewBox="0 0 1000 889" role="img" aria-labelledby="title description"><title id="title">Move pending references to their queues</title><desc id="description">This describes OpenJDK 8. It is not a claim that System.gc always performs a collection or immediate enqueueing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="889" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">OPENJDK 8U272-B10</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Move pending references to their queues</text>
<rect x="42" y="135" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="165" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">01  Garbage collector</text>
<text x="63" y="192" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Discover eligible references; update VM-managed reference state.</text>
<path d="M 500 217 L 500 239" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="244" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="274" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">02  Reference.pending</text>
<text x="63" y="301" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Head of the VM’s pending reference list.</text>
<path d="M 500 326 L 500 348" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="353" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="383" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">03  Reference Handler thread</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Detach a reference while holding Reference.lock.</text>
<path d="M 500 435 L 500 457" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="462" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="492" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">04  Special Cleaner path</text>
<text x="63" y="519" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Run Cleaner.clean for a Cleaner reference.</text>
<path d="M 500 544 L 500 566" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="571" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="601" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">05  Ordinary reference path</text>
<text x="63" y="628" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">If its queue is not NULL, enqueue the Reference object.</text>
<path d="M 500 653 L 500 675" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="680" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="710" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">06  Application queue</text>
<text x="63" y="737" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Observe the enqueued reference through ReferenceQueue.poll / remove.</text>
<text x="34" y="803" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">This describes OpenJDK 8. It is not a claim that System.gc always performs a collection or immediate</text>
<text x="34" y="822" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">enqueueing.</text>
<a href="https://github.com/openjdk/jdk8u/blob/c3b5603e949d6272d777ef57952833672a97b4e3/jdk/src/share/classes/java/lang/ref/Reference.java">
<text x="34" y="867" font-size="13" fill="#2161ad" font-weight="400" text-anchor="start">Source: Reference.java • OpenJDK 8u272-b10</text>
</a></g></svg>
