<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Reference constructors select a queue</text>
<rect x="34" y="133" width="932" height="227" rx="10" fill="#edf3fa" stroke="#d5dfeb"/>
<text x="53" y="159" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace">    Reference(T referent) {</text>
<text x="53" y="183" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace">        this(referent, null);</text>
<text x="53" y="207" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace">    }</text>
<text x="53" y="231" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace">    Reference(T referent, ReferenceQueue&lt;? super T&gt; queue) {</text>
<text x="53" y="255" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace">        this.referent = referent;</text>
<text x="53" y="279" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace">        this.queue = (queue == null) ? ReferenceQueue.NULL : queue;</text>
<text x="53" y="303" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace">    }</text>
<text x="53" y="327" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace">}</text>
