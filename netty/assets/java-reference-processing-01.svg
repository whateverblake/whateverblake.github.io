<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="507" viewBox="0 0 1000 507" role="img" aria-labelledby="title description"><title id="title">Reference constructors select a queue</title><desc id="description">The referent is a specially handled reference field; registration with a queue is optional.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="507" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
