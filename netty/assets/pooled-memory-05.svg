<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Pooled or not: decided by size</title><desc id="d">Requests up to one chunk come from the pool; larger ones bypass it.</desc><defs><marker id="a-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="a-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/></marker><marker id="a-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="a-bc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/></marker><marker id="a-59636e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/></marker><marker id="a-d1d9e0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d9e0"/></marker></defs><rect width="960" height="300" fill="#ffffff"/><text x="32.0" y="40.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">Pooled or not: decided by size</text>
<text x="32.0" y="64.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">Requests up to one chunk come from the pool; larger ones bypass it.</text>
<circle cx="80" cy="175" r="40" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
<text x="80.0" y="179.3" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle">request</text>
<polygon points="330,130.0 455.0,175 330,220.0 205.0,175" fill="#f6f8fa" stroke="#59636e" stroke-width="1.3"/>
<text x="330.0" y="171.8" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="500" text-anchor="middle">size ≤ chunk size</text>
<text x="330.0" y="187.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="500" text-anchor="middle">(16 MiB)?</text>
<rect x="600.0" y="92.0" width="328.0" height="64.0" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.3"/>
<text x="764.0" y="120.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8250df" font-weight="600" text-anchor="middle">pooled</text>
<text x="764.0" y="136.8" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="middle">arena → chunk → pages / subpage units</text>
<rect x="600.0" y="196.0" width="328.0" height="64.0" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.3"/>
<text x="764.0" y="224.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#bc4c00" font-weight="600" text-anchor="middle">unpooled (huge)</text>
<text x="764.0" y="240.8" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="middle">allocateHuge(): its own off-heap memory</text>
