<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title description"><title id="title">Legacy pooled-memory hierarchy</title><desc id="description">This preserves the original allocator model. Netty 4.1.53 uses SizeClasses and a different run allocator.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="780" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">LEGACY: NETTY 4.1.50.FINAL</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Legacy pooled-memory hierarchy</text>
<rect x="42" y="135" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="165" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">01  PooledByteBufAllocator</text>
<text x="63" y="192" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Own heap and direct arenas; assign an arena to each thread cache.</text>
<path d="M 500 217 L 500 239" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="244" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="274" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">02  PoolArena</text>
<text x="63" y="301" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Manage chunk lists and subpage pools.</text>
<path d="M 500 326 L 500 348" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="353" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="383" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">03  PoolChunk</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Default 16 MiB of memory; divide it into 2048 pages.</text>
<path d="M 500 435 L 500 457" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="462" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="492" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">04  Page</text>
<text x="63" y="519" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Default 8 KiB; allocate runs of pages or subdivide one page.</text>
<path d="M 500 544 L 500 566" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="571" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="601" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">05  PoolSubpage</text>
<text x="63" y="628" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Split a page into fixed-size allocation elements.</text>
<text x="34" y="694" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">This preserves the original allocator model. Netty 4.1.53 uses SizeClasses and a different run allocator.</text>
<a href="https://github.com/netty/netty/blob/8c5b72aaf02e7f349a9972dd9179b449b5a6067b/buffer/src/main/java/io/netty/buffer/PoolArena.java">
<text x="34" y="758" font-size="13" fill="#2161ad" font-weight="400" text-anchor="start">Source: PoolArena.java • Legacy: Netty 4.1.50.Final</text>
</a></g></svg>
