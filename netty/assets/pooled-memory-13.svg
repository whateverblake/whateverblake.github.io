<text x="89.0" y="188" font-size="16" fill="#182a42" font-weight="700" text-anchor="middle">bits 63</text>
<text x="89.0" y="224" font-size="18" fill="#182a42" font-weight="400" text-anchor="middle">unused</text>
<rect x="144" y="156" width="110" height="128" rx="10" fill="#dfeaf8" stroke="#d5dfeb"/>
<text x="199.0" y="188" font-size="16" fill="#182a42" font-weight="700" text-anchor="middle">bits 62</text>
<text x="199.0" y="224" font-size="18" fill="#182a42" font-weight="400" text-anchor="middle">subpage</text>
<text x="199.0" y="249" font-size="18" fill="#182a42" font-weight="400" text-anchor="middle">marker</text>
