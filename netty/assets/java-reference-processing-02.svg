<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img" aria-labelledby="title description"><title id="title">Registered queue versus no queue</title><desc id="description">Registered queue versus no queue</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="635" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">OPENJDK 8U272-B10</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Registered queue versus no queue</text>
<rect x="42" y="132" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="160" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">new WeakReference(object)</text>
<text x="63" y="185" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Constructor uses no application ReferenceQueue.</text>
<rect x="42" y="207" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="235" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">new WeakReference(object, queue)</text>
<text x="63" y="260" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Associate this reference with the supplied queue.</text>
<rect x="42" y="282" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="310" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">ReferenceQueue.NULL</text>
<text x="63" y="335" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Sentinel used when the constructor’s queue is null.</text>
<rect x="42" y="357" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="385" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">ReferenceQueue.ENQUEUED</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Sentinel after successful enqueueing.</text>
<rect x="42" y="432" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="460" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Application</text>
<text x="63" y="485" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">poll or remove reads reference objects, not their former referents.</text>
<text x="34" y="549" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">English explanatory reconstruction from the named source.</text>
