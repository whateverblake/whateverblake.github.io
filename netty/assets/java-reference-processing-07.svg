<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title description"><title id="title">Use a conditional breakpoint to narrow observations</title><desc id="description">Recreated debugging instructions, not a screenshot from a reproduced IntelliJ session.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="710" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">OPENJDK 8U272-B10</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Use a conditional breakpoint to narrow observations</text>
<rect x="42" y="132" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="160" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Breakpoint</text>
<text x="63" y="185" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Reference.tryHandlePending at the pending-list handling path</text>
<rect x="42" y="207" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="235" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Example condition</text>
<text x="63" y="260" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">pending instanceof WeakReference</text>
<rect x="42" y="282" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="310" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Exclude weak-map traffic</text>
<text x="63" y="335" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">&amp;&amp; !(pending instanceof java.util.WeakHashMap.Entry)</text>
<rect x="42" y="357" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="385" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">IDE context</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Some conditions may need evaluation from the declaring source scope.</text>
<rect x="42" y="432" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="460" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Observation</text>
<text x="63" y="485" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Inspect the reference and queue; runtime timing and values vary.</text>
<rect x="42" y="507" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="535" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Do not infer</text>
<text x="63" y="560" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">A requested GC or breakpoint alone does not guarantee object reclamation.</text>
<text x="34" y="624" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">Recreated debugging instructions, not a screenshot from a reproduced IntelliJ session.</text>
