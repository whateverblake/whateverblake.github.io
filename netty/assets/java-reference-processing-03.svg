<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="987" viewBox="0 0 1000 987" role="img" aria-labelledby="title description"><title id="title">Reference: queue and VM-managed links</title><desc id="description">Selected source fields replace the missing class/debugger capture. VM links require special treatment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="987" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">OPENJDK 8U272-B10</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Reference: queue and VM-managed links</text>
<rect x="34" y="133" width="932" height="707" rx="10" fill="#edf3fa" stroke="#d5dfeb"/>
<text x="53" y="159" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">private T referent;         /* Treated specially by GC */</text>
<text x="53" y="183" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">volatile ReferenceQueue&lt;? super T&gt; queue;</text>
<text x="53" y="207" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">/* When active:   NULL</text>
<text x="53" y="231" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> *     pending:   this</text>
<text x="53" y="255" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> *    Enqueued:   next reference in queue (or this if last)</text>
<text x="53" y="279" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> *    Inactive:   this</text>
<text x="53" y="303" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> */</text>
<text x="53" y="327" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">@SuppressWarnings(&quot;rawtypes&quot;)</text>
<text x="53" y="351" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">volatile Reference next;</text>
<text x="53" y="375" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">/* When active:   next element in a discovered reference list maintained by GC (or this if last)</text>
<text x="53" y="399" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> *     pending:   next element in the pending list (or null if last)</text>
<text x="53" y="423" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> *   otherwise:   NULL</text>
<text x="53" y="447" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> */</text>
<text x="53" y="471" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">transient private Reference&lt;T&gt; discovered;  /* used by VM */</text>
<text x="53" y="495" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">/* Object used to synchronize with the garbage collector.  The collector</text>
<text x="53" y="519" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> * must acquire this lock at the beginning of each collection cycle.  It is</text>
<text x="53" y="543" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> * therefore critical that any code holding this lock complete as quickly</text>
<text x="53" y="567" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> * as possible, allocate no new objects, and avoid calling user code.</text>
<text x="53" y="591" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> */</text>
<text x="53" y="615" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">static private class Lock { }</text>
<text x="53" y="639" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">private static Lock lock = new Lock();</text>
<text x="53" y="663" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">/* List of References waiting to be enqueued.  The collector adds</text>
<text x="53" y="687" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> * References to this list, while the Reference-handler thread removes</text>
<text x="53" y="711" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> * them.  This list is protected by the above lock object. The</text>
<text x="53" y="735" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> * list uses the discovered field to link its elements.</text>
<text x="53" y="759" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre"> */</text>
<text x="53" y="783" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">private static Reference&lt;Object&gt; pending = null;</text>
<text x="53" y="807" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">/* High-priority thread to enqueue pending References</text>
<text x="34" y="878" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">Selected excerpt begins at source line 92; no runtime state is shown.</text>
