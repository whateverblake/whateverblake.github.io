<text x="480.0" y="626.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="middle">From now on the boss loop&#x27;s selector reports new connections; ServerBootstrapAcceptor hands each one to workerGroup.</text></svg>
