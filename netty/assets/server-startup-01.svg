<text x="80.0" y="427.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1f2328" font-weight="500" text-anchor="start">doBind0()</text>
<path d="M 260.0 422.0 L 600.0 422.0" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#a-bc4c00)"/>
<text x="430.0" y="414.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#bc4c00" font-weight="500" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">bind task</text>
<text x="700.0" y="427.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#bc4c00" font-weight="600" text-anchor="start">pipeline.bind</text>
<text x="700.0" y="446.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">tail → … → HeadContext</text>
<text x="700.0" y="463.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">unsafe.bind → doBind (Java bind)</text>
<text x="700.0" y="480.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">fireChannelActive</text>
<text x="700.0" y="517.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#bc4c00" font-weight="600" text-anchor="start">HeadContext.read</text>
<text x="700.0" y="536.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">unsafe.beginRead → doBeginRead</text>
