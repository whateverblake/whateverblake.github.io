<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="t d"><title id="t">Recycle an object</title><desc id="d">The object goes back through its handle to the Stack it came from.</desc><defs><marker id="a-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="a-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/></marker><marker id="a-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="a-bc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/></marker><marker id="a-59636e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/></marker><marker id="a-d1d9e0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d9e0"/></marker></defs><rect width="960" height="210" fill="#ffffff"/><text x="32.0" y="40.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">Recycle an object</text>
<text x="32.0" y="64.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">The object goes back through its handle to the Stack it came from.</text>
<rect x="32.0" y="100.0" width="270.0" height="54.0" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
<text x="167.0" y="123.2" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1a7f37" font-weight="600" text-anchor="middle">obj.recycle()</text>
<text x="167.0" y="140.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">user code, any thread</text>
<rect x="344.0" y="100.0" width="270.0" height="54.0" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.3"/>
<text x="479.0" y="123.2" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#bc4c00" font-weight="600" text-anchor="middle">handle.recycle(obj)</text>
<text x="479.0" y="140.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">DefaultHandle</text>
<rect x="656.0" y="100.0" width="270.0" height="54.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="791.0" y="123.2" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0969da" font-weight="600" text-anchor="middle">stack.push(handle)</text>
<text x="791.0" y="140.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">the Stack that created it</text>
