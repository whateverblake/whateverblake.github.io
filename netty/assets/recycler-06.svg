<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title description"><title id="title">Stack.push chooses the return path</title><desc id="description">Stack.push chooses the return path</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="560" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">NETTY 4.1.53.FINAL</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Stack.push chooses the return path</text>
<rect x="42" y="132" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="160" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Condition</text>
<text x="63" y="185" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">stack.threadRef.get() == Thread.currentThread()</text>
<rect x="42" y="207" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="235" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">True → pushNow</text>
<text x="63" y="260" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Return the handle directly to the owning stack.</text>
<rect x="42" y="282" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="310" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">False → pushLater</text>
<text x="63" y="335" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Return through the recycling thread’s WeakOrderQueue.</text>
<rect x="42" y="357" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="385" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Purpose</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Avoid pushing into another thread’s elements array directly.</text>
<text x="34" y="474" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">English explanatory reconstruction from the named source.</text>
<a href="https://github.com/netty/netty/blob/d4a0050ef33cab2542a80e11489a4977a63859f8/common/src/main/java/io/netty/util/Recycler.java">
<text x="34" y="538" font-size="13" fill="#2161ad" font-weight="400" text-anchor="start">Source: Recycler.java • Netty 4.1.53.Final</text>
</a></g></svg>
