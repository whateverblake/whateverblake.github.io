<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="723" viewBox="0 0 1000 723" role="img" aria-labelledby="title description"><title id="title">Reference Handler detects Cleaner references</title><desc id="description">Actual source around the Cleaner type check; no debugger values are shown.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="723" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">OPENJDK 8U272-B10</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Reference Handler detects Cleaner references</text>
<rect x="34" y="133" width="932" height="443" rx="10" fill="#edf3fa" stroke="#d5dfeb"/>
<text x="53" y="159" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">if (pending != null) {</text>
<text x="53" y="183" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    r = pending;</text>
<text x="53" y="207" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    // &#x27;instanceof&#x27; might throw OutOfMemoryError sometimes</text>
<text x="53" y="231" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    // so do this before un-linking &#x27;r&#x27; from the &#x27;pending&#x27; chain...</text>
<text x="53" y="255" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    c = r instanceof Cleaner ? (Cleaner) r : null;</text>
<text x="53" y="279" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    // unlink &#x27;r&#x27; from &#x27;pending&#x27; chain</text>
<text x="53" y="303" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    pending = r.discovered;</text>
<text x="53" y="327" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    r.discovered = null;</text>
<text x="53" y="351" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">} else {</text>
<text x="53" y="375" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    // The waiting on the lock may cause an OutOfMemoryError</text>
<text x="53" y="399" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    // because it may try to allocate exception objects.</text>
<text x="53" y="423" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    if (waitForNotify) {</text>
<text x="53" y="447" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">        lock.wait();</text>
<text x="53" y="471" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    }</text>
<text x="53" y="495" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    // retry if waited</text>
<text x="53" y="519" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    return waitForNotify;</text>
<text x="53" y="543" font-size="15" fill="#182a42" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">}</text>
