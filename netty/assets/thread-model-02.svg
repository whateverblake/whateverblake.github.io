<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title description"><title id="title">Three kinds of NioEventLoop work</title><desc id="description">Three kinds of NioEventLoop work</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="560" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">NETTY 4.1.53.FINAL</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Three kinds of NioEventLoop work</text>
<rect x="42" y="132" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="160" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Selector I/O</text>
<text x="63" y="185" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Ready registered channel operations</text>
<rect x="42" y="207" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="235" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">taskQueue</text>
<text x="63" y="260" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Immediate Runnable tasks submitted to this loop</text>
<rect x="42" y="282" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="310" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">scheduledTaskQueue</text>
<text x="63" y="335" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Delayed and periodic tasks when their deadlines arrive</text>
<rect x="42" y="357" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="385" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">One event-loop thread</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Execute these categories while balancing I/O and task work.</text>
<text x="34" y="474" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">English explanatory reconstruction from the named source.</text>
