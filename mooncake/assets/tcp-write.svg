<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">A TCP WRITE between two sessions</title><desc id="d">Protocol v2 · CPU memory · the order the caller waits for</desc><defs><marker id="a-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="a-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/></marker><marker id="a-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="a-bc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/></marker><marker id="a-59636e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/></marker><marker id="a-d1d9e0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d9e0"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="32.0" y="40.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">A TCP WRITE between two sessions</text>
<text x="32.0" y="64.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">Protocol v2 · CPU memory · the order the caller waits for</text>
<rect x="75.4" y="86.0" width="209.2" height="32.0" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
<text x="180.0" y="107.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1a7f37" font-weight="600" text-anchor="middle">ClientSession · caller</text>
<path d="M 180.0 118.0 L 180.0 400.0" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="519.5" y="86.0" width="200.9" height="32.0" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1"/>
<text x="620.0" y="107.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#8250df" font-weight="600" text-anchor="middle">ServerSession · owner</text>
<path d="M 620.0 118.0 L 620.0 400.0" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 180.0 160.0 L 620.0 160.0" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#a-bc4c00)"/>
<text x="400.0" y="152.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#bc4c00" font-weight="500" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">header: WRITE · 0x70002000 · 4096</text>
<text x="628.0" y="192.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">readHeader() · check range is registered</text>
<path d="M 180.0 232.0 L 620.0 232.0" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#a-bc4c00)"/>
<text x="400.0" y="224.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#bc4c00" font-weight="500" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">body: 4096 bytes from the staging buffer</text>
<text x="628.0" y="264.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">readBody() → owner memory 0x70002000</text>
<path d="M 620.0 304.0 L 180.0 304.0" fill="none" stroke="#8250df" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-8250df)"/>
<text x="400.0" y="296.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8250df" font-weight="500" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">status: success (after the full body)</text>
<text x="628.0" y="336.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">wait for the next header on this socket</text>
<text x="480.0" y="424.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">Done = body written AND status received. Then the caller sends PutEnd to the master.</text></svg>
