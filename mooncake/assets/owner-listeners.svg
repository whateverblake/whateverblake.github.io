<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1370" viewBox="0 0 720 1370" role="img" aria-labelledby="title desc">
<title id="title">Start two different listeners</title><desc id="desc">Startup runs top to bottom; both listeners remain active.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="720" height="1370" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="27" fill="#15283f" font-weight="700" text-anchor="start">Start two different listeners</text>
<text x="32" y="75" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Startup runs top to bottom; both listeners remain active.</text>
<rect x="32" y="108" width="656" height="92" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="120" width="5" height="68" rx="2" fill="#087f78"/>
<text x="52" y="141" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">1  Client::InitTransferEngine()</text>
<text x="52" y="171" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Initialize the engine, then install the TCP transport.</text>
<path d="M 360 205 L 360 224" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="230" width="656" height="92" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="242" width="5" height="68" rx="2" fill="#087f78"/>
<text x="52" y="263" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">2  TransferEngineImpl::init()</text>
<text x="52" y="293" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Choose H; create TransferMetadata + MultiTransport.</text>
<path d="M 360 327 L 360 346" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="352" width="656" height="92" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="364" width="5" height="68" rx="2" fill="#7651ac"/>
<text x="52" y="385" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">3  addRpcMetaEntry()</text>
<text x="52" y="415" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Save handshake address; register peer callbacks.</text>
<path d="M 360 449 L 360 468" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="474" width="656" height="92" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="486" width="5" height="68" rx="2" fill="#7651ac"/>
<text x="52" y="507" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">4  Start the handshake listener</text>
<text x="52" y="537" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">SocketHandShakePlugin::startDaemon() listens on H.</text>
<path d="M 360 571 L 360 590" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="596" width="656" height="92" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="608" width="5" height="68" rx="2" fill="#b35a13"/>
<text x="52" y="629" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">5  TcpTransport::install()</text>
<text x="52" y="659" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Choose D; store the TCP endpoint in SegmentDesc.</text>
<path d="M 360 693 L 360 712" fill="none" stroke="#b35a13" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="718" width="656" height="92" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="730" width="5" height="68" rx="2" fill="#b35a13"/>
<text x="52" y="751" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">6  Construct TcpContext</text>
<text x="52" y="781" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">acceptor(io_context) binds and listens on D.</text>
<path d="M 360 815 L 360 834" fill="none" stroke="#b35a13" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="840" width="656" height="92" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="852" width="5" height="68" rx="2" fill="#b35a13"/>
<text x="52" y="873" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">7  Start the TCP worker</text>
<text x="52" y="903" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">doAccept() starts acceptance; io_context.run() runs I/O.</text>
<text x="360" y="985" font-size="19" fill="#536579" font-weight="700" text-anchor="middle">RUNNING AFTER THIS STAGE</text>
<rect x="32" y="1010" width="656" height="117" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="1022" width="5" height="93" rx="2" fill="#7651ac"/>
<text x="52" y="1043" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">SocketHandShakePlugin listens on H</text>
<text x="52" y="1073" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">listen_fd_: listening socket for metadata / control</text>
<text x="52" y="1100" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">listener_: thread accepting peer connections</text>
<rect x="32" y="1150" width="656" height="117" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="1162" width="5" height="93" rx="2" fill="#b35a13"/>
<text x="52" y="1183" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">TcpContext::acceptor listens on D</text>
<text x="52" y="1213" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">TcpTransport owns the context and runs the worker.</text>
<text x="52" y="1240" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">ServerSession handles each accepted data connection.</text>
<text x="360" y="1319" font-size="22" fill="#15283f" font-weight="700" text-anchor="middle">Global memory is registered and mounted later.</text>
<text x="32" y="1350" font-size="12" fill="#536579" font-weight="700" text-anchor="start">MOONCAKE  /  SOURCE WALKTHROUGH</text>
</g></svg>
