<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1470" viewBox="0 0 1200 1470" role="img" aria-labelledby="title desc">
<title id="title">Master service: key metadata and available storage</title><desc id="desc">TCP + CPU memory · nested boxes show the main member relationships</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="1470" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="27" fill="#15283f" font-weight="700" text-anchor="start">Master service: key metadata and available storage</text>
<text x="32" y="75" font-size="18" fill="#536579" font-weight="400" text-anchor="start">TCP + CPU memory · nested boxes show the main member relationships</text>
<rect x="24" y="110" width="1152" height="1280" rx="14" fill="#eaf3ff" stroke="#2563b0" stroke-width="2"/>
<text x="46" y="145" font-size="25" fill="#2563b0" font-weight="700" text-anchor="start">MasterService</text>
<rect x="48" y="186" width="664" height="1170" rx="14" fill="#f0edf9" stroke="#7651ac" stroke-width="2"/>
<text x="70" y="221" font-size="25" fill="#7651ac" font-weight="700" text-anchor="start">metadata_shards_: 1024 MetadataShard</text>
<text x="72" y="252" font-size="22" fill="#7651ac" font-weight="400" text-anchor="start">Find an object by tenant + key</text>
<rect x="72" y="281" width="616" height="1048" rx="14" fill="#faf8ff" stroke="#7651ac" stroke-width="2"/>
<text x="94" y="316" font-size="25" fill="#7651ac" font-weight="700" text-anchor="start">MetadataShard  [s]</text>
<text x="96" y="347" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">mutex: protects this shard</text>
<text x="96" y="379" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">tenants: TenantId → TenantState</text>
<rect x="96" y="402" width="568" height="900" rx="14" fill="#e4f4f0" stroke="#087f78" stroke-width="2"/>
<text x="118" y="437" font-size="25" fill="#087f78" font-weight="700" text-anchor="start">TenantState</text>
<text x="120" y="469" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">metadata: string key → ObjectMetadata</text>
<text x="120" y="501" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">processing_keys: keys with unfinished writes</text>
<rect x="120" y="553" width="520" height="720" rx="14" fill="#f7fcfa" stroke="#087f78" stroke-width="2"/>
<text x="142" y="588" font-size="25" fill="#087f78" font-weight="700" text-anchor="start">ObjectMetadata  [key]</text>
<text x="144" y="619" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">tenant_id · user_key · writer client_id</text>
<text x="144" y="651" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">size · lease_timeout</text>
<text x="144" y="691" font-size="21" fill="#087f78" font-weight="400" text-anchor="start">replicas_: vector&lt;Replica&gt;</text>
<rect x="144" y="716" width="472" height="530" rx="14" fill="#fff4e8" stroke="#b35a13" stroke-width="2"/>
<text x="166" y="751" font-size="25" fill="#b35a13" font-weight="700" text-anchor="start">Replica</text>
<text x="168" y="782" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">id_: ReplicaID (uint64_t)</text>
<text x="168" y="813" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">status_: ReplicaStatus enum</text>
<text x="168" y="844" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">data_: variant holding MemoryReplicaData</text>
<rect x="168" y="866" width="424" height="354" rx="14" fill="#fffaf1" stroke="#b35a13" stroke-width="2"/>
<text x="190" y="901" font-size="25" fill="#b35a13" font-weight="700" text-anchor="start">MemoryReplicaData</text>
<text x="192" y="933" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">buffer: unique_ptr&lt;AllocatedBuffer&gt;</text>
<rect x="192" y="966" width="376" height="227" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="192" y="978" width="5" height="203" rx="2" fill="#b35a13"/>
<text x="212" y="999" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">AllocatedBuffer</text>
<text x="212" y="1032" font-size="19" fill="#15283f" font-weight="400" text-anchor="start">buffer_ptr_: address in the owner</text>
<text x="212" y="1063" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">size_ · protocol = &quot;tcp&quot;</text>
<text x="212" y="1094" font-size="19" fill="#15283f" font-weight="400" text-anchor="start">offset_handle_: reserved range</text>
<text x="212" y="1130" font-size="20" fill="#7651ac" font-weight="400" text-anchor="start">allocator_: weak_ptr</text>
<text x="212" y="1168" font-size="18" fill="#536579" font-weight="400" text-anchor="start">No payload stored in this object.</text>
<rect x="752" y="186" width="400" height="1170" rx="14" fill="#e4f4f0" stroke="#087f78" stroke-width="2"/>
<text x="774" y="221" font-size="25" fill="#087f78" font-weight="700" text-anchor="start">SegmentManager</text>
<text x="776" y="252" font-size="19" fill="#087f78" font-weight="400" text-anchor="start">segment_manager_: storage capacity</text>
<rect x="776" y="292" width="352" height="170" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="776" y="304" width="5" height="146" rx="2" fill="#2563b0"/>
<text x="796" y="325" font-size="22" fill="#2563b0" font-weight="700" text-anchor="start">mounted_segments_</text>
<text x="796" y="355" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Segment UUID → MountedSegment</text>
<text x="796" y="382" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">segment: owner pool description</text>
<text x="796" y="409" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">status: SegmentStatus</text>
<text x="796" y="436" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">buf_allocator: shared_ptr</text>
<rect x="776" y="505" width="352" height="157" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="776" y="517" width="5" height="133" rx="2" fill="#087f78"/>
<text x="796" y="538" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">AllocatorManager</text>
<text x="796" y="568" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">allocator_manager_</text>
<text x="796" y="595" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">allocators_: name → vector</text>
<text x="796" y="622" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">of shared allocator pointers</text>
<path d="M 952 667 L 952 721" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="775" y="701" font-size="19" fill="#087f78" font-weight="400" text-anchor="start">Same allocator</text>
<rect x="776" y="728" width="352" height="209" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="776" y="740" width="5" height="185" rx="2" fill="#087f78"/>
<text x="796" y="761" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">OffsetBufferAllocator</text>
<text x="796" y="791" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">base_ · total_size_ · endpoint</text>
<rect x="796" y="846" width="312" height="73" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="796" y="858" width="5" height="49" rx="2" fill="#087f78"/>
<text x="816" y="879" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">OffsetAllocator</text>
<text x="816" y="909" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Free blocks and size bins</text>
<path d="M 1129 421 L 1140 421 L 1140 818 L 1131 818" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 570 1124 L 732 1124 L 732 819 L 771 819" fill="none" stroke="#7651ac" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<rect x="776" y="998" width="352" height="294" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="776" y="1010" width="5" height="270" rx="2" fill="#2563b0"/>
<text x="796" y="1031" font-size="22" fill="#2563b0" font-weight="700" text-anchor="start">Other segment indexes</text>
<text x="796" y="1060" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">client_segments_</text>
<text x="796" y="1091" font-size="19" fill="#15283f" font-weight="400" text-anchor="start">owner UUID → segment UUIDs</text>
<text x="796" y="1133" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">client_by_name_</text>
<text x="796" y="1174" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">segment_id_by_name_</text>
<text x="796" y="1215" font-size="21" fill="#15283f" font-weight="400" text-anchor="start">segments_by_host_</text>
<text x="796" y="1259" font-size="19" fill="#536579" font-weight="400" text-anchor="start">These locate pools, not keys.</text>
<text x="40" y="1424" font-size="21" fill="#536579" font-weight="400" text-anchor="start">Solid arrows: shared allocator references. Dashed arrow: AllocatedBuffer holds a weak reference.</text>
<text x="32" y="1450" font-size="12" fill="#536579" font-weight="700" text-anchor="start">MOONCAKE  /  SOURCE WALKTHROUGH</text>
</g></svg>
