<svg xmlns="http://www.w3.org/2000/svg" width="720" height="605" viewBox="0 0 720 605" role="img" aria-labelledby="title desc">
<title id="title">What the master keeps</title><desc id="desc">These are records and coordination state, not payload pools.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="720" height="605" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="27" fill="#15283f" font-weight="700" text-anchor="start">What the master keeps</text>
<text x="32" y="75" font-size="18" fill="#536579" font-weight="400" text-anchor="start">These are records and coordination state, not payload pools.</text>
<rect x="32" y="110" width="656" height="89" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="122" width="5" height="65" rx="2" fill="#2563b0"/>
<text x="52" y="143" font-size="22" fill="#2563b0" font-weight="700" text-anchor="start">MasterService</text>
<text x="52" y="173" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Owns metadata, managers, and background work.</text>
<path d="M 184 201 L 184 226" fill="none" stroke="#2563b0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 536 201 L 536 226" fill="none" stroke="#2563b0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="231" width="304" height="143" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="243" width="5" height="119" rx="2" fill="#2563b0"/>
<text x="52" y="264" font-size="22" fill="#2563b0" font-weight="700" text-anchor="start">Object metadata</text>
<text x="52" y="294" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Tenant + key</text>
<text x="52" y="321" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Replica state + address</text>
<text x="52" y="348" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Writer + lease</text>
<rect x="384" y="231" width="304" height="143" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="384" y="243" width="5" height="119" rx="2" fill="#7651ac"/>
<text x="404" y="264" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">SegmentManager</text>
<text x="404" y="294" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Mounted owner regions</text>
<text x="404" y="321" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Free-space allocators</text>
<text x="404" y="348" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Client / host indexes</text>
<rect x="32" y="398" width="304" height="143" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="410" width="5" height="119" rx="2" fill="#087f78"/>
<text x="52" y="431" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">ClientTaskManager</text>
<text x="52" y="461" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Copy / move assignments</text>
<text x="52" y="488" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Status + retry state</text>
<text x="52" y="515" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Owners execute tasks</text>
<rect x="384" y="398" width="304" height="143" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="384" y="410" width="5" height="119" rx="2" fill="#b35a13"/>
<text x="404" y="431" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">Background workers</text>
<text x="404" y="461" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Expiry + eviction</text>
<text x="404" y="488" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Replica / task cleanup</text>
<text x="404" y="515" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Drain jobs + admission</text>
<text x="32" y="585" font-size="12" fill="#536579" font-weight="700" text-anchor="start">MOONCAKE  /  SOURCE WALKTHROUGH</text>
</g></svg>
