<svg xmlns="http://www.w3.org/2000/svg" width="720" height="775" viewBox="0 0 720 775" role="img" aria-labelledby="title desc">
<title id="title">Get reuses the same caller</title><desc id="desc">One completed memory replica · TCP protocol v2</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="720" height="775" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="27" fill="#15283f" font-weight="700" text-anchor="start">Get reuses the same caller</text>
<text x="32" y="75" font-size="18" fill="#536579" font-weight="400" text-anchor="start">One completed memory replica · TCP protocol v2</text>
<rect x="32" y="108" width="158" height="56" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="120" width="5" height="32" rx="2" fill="#087f78"/>
<text x="52" y="141" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">CALLER</text>
<path d="M 111 177 L 111 655" stroke="#bdcbdc" stroke-width="2" stroke-dasharray="5 7"/>
<rect x="281" y="108" width="158" height="56" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="281" y="120" width="5" height="32" rx="2" fill="#2563b0"/>
<text x="301" y="141" font-size="22" fill="#2563b0" font-weight="700" text-anchor="start">MASTER</text>
<path d="M 360 177 L 360 655" stroke="#bdcbdc" stroke-width="2" stroke-dasharray="5 7"/>
<rect x="530" y="108" width="158" height="56" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="530" y="120" width="5" height="32" rx="2" fill="#7651ac"/>
<text x="550" y="141" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">OWNER</text>
<path d="M 609 177 L 609 655" stroke="#bdcbdc" stroke-width="2" stroke-dasharray="5 7"/>
<text x="235.5" y="205" font-size="20" fill="#2563b0" font-weight="400" text-anchor="middle">Query the key</text>
<path d="M 111 220 L 360 220" fill="none" stroke="#2563b0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="235.5" y="285" font-size="20" fill="#2563b0" font-weight="400" text-anchor="middle">Replicas + lease</text>
<path d="M 360 300 L 111 300" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="360.0" y="438" font-size="20" fill="#b35a13" font-weight="400" text-anchor="middle">READ header: owner address + length</text>
<path d="M 111 453 L 609 453" fill="none" stroke="#b35a13" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="360.0" y="518" font-size="20" fill="#b35a13" font-weight="400" text-anchor="middle">Status response</text>
<path d="M 609 533 L 111 533" fill="none" stroke="#b35a13" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="360.0" y="590" font-size="20" fill="#b35a13" font-weight="400" text-anchor="middle">Value bytes → caller local buffer</text>
<path d="M 609 605 L 111 605" fill="none" stroke="#b35a13" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="360" y="365" font-size="20" fill="#15283f" font-weight="400" text-anchor="middle">Choose a replica and allocate a local destination.</text>
<text x="360" y="396" font-size="19" fill="#536579" font-weight="400" text-anchor="middle">Reuse peer metadata, or fetch it through P2P.</text>
<text x="360" y="694" font-size="22" fill="#15283f" font-weight="700" text-anchor="middle">get_buffer() returns a handle to the received bytes.</text>
<text x="360" y="730" font-size="20" fill="#536579" font-weight="400" text-anchor="middle">No new client, no global allocation, and no PutEnd.</text>
<text x="32" y="755" font-size="12" fill="#536579" font-weight="700" text-anchor="start">MOONCAKE  /  SOURCE WALKTHROUGH</text>
</g></svg>
