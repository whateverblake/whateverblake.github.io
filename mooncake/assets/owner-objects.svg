<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1390" viewBox="0 0 720 1390" role="img" aria-labelledby="title desc">
<title id="title">Inside one owner process</title><desc id="desc">Object relationships • classic Transfer Engine • TCP + P2P</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="720" height="1390" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="27" fill="#15283f" font-weight="700" text-anchor="start">Inside one owner process</text>
<text x="32" y="75" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Object relationships • classic Transfer Engine • TCP + P2P</text>
<rect x="112" y="112" width="496" height="111" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="112" y="124" width="5" height="87" rx="2" fill="#7651ac"/>
<text x="132" y="145" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">RealClient</text>
<text x="132" y="175" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">High-level API + process-owned buffers</text>
<text x="132" y="202" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Inherits PyClient; client_ holds Client.</text>
<path d="M 360 228 L 360 261" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="112" y="268" width="496" height="111" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="112" y="280" width="5" height="87" rx="2" fill="#087f78"/>
<text x="132" y="301" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">Client</text>
<text x="132" y="331" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">MasterClient handles Store RPCs.</text>
<text x="132" y="358" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">TransferSubmitter uses the same engine below.</text>
<path d="M 360 384 L 360 426" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="379" y="411" font-size="18" fill="#536579" font-weight="400" text-anchor="start">transfer_engine_</text>
<rect x="112" y="433" width="496" height="85" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="112" y="445" width="5" height="61" rx="2" fill="#087f78"/>
<text x="132" y="466" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">TransferEngine</text>
<text x="132" y="496" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Public transfer API</text>
<path d="M 360 523 L 360 565" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="379" y="550" font-size="18" fill="#536579" font-weight="400" text-anchor="start">impl_</text>
<rect x="112" y="572" width="496" height="111" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="112" y="584" width="5" height="87" rx="2" fill="#087f78"/>
<text x="132" y="605" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">TransferEngineImpl</text>
<text x="132" y="635" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Registration state + transport coordination</text>
<text x="132" y="662" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Holds MultiTransport and TransferMetadata.</text>
<path d="M 224 688 L 184 747" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 496 688 L 540 747" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="32" y="719" font-size="18" fill="#536579" font-weight="400" text-anchor="start">multi_transports_</text>
<text x="535" y="719" font-size="18" fill="#536579" font-weight="400" text-anchor="start">metadata_</text>
<rect x="32" y="754" width="300" height="111" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="766" width="5" height="87" rx="2" fill="#087f78"/>
<text x="52" y="787" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">MultiTransport</text>
<text x="52" y="817" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">transport_map_[&quot;tcp&quot;]</text>
<text x="52" y="844" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Selects the transport.</text>
<rect x="392" y="754" width="296" height="165" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="392" y="766" width="5" height="141" rx="2" fill="#7651ac"/>
<text x="412" y="787" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">TransferMetadata</text>
<text x="412" y="817" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">ONE shared object</text>
<text x="412" y="844" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">SegmentDesc / BufferDesc</text>
<text x="412" y="871" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Peer cache + local info</text>
<text x="412" y="898" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Handshake callbacks</text>
<path d="M 337 810 L 387 810" fill="none" stroke="#7651ac" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 184 870 L 184 940" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="204" y="907" font-size="17" fill="#536579" font-weight="400" text-anchor="start">Transport pointer</text>
<rect x="32" y="947" width="300" height="139" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="959" width="5" height="115" rx="2" fill="#b35a13"/>
<text x="52" y="980" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">TcpTransport</text>
<text x="52" y="1010" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Implements Transport</text>
<text x="52" y="1037" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">context_ holds TcpContext.</text>
<text x="52" y="1064" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">thread_ runs TCP I/O.</text>
<path d="M 333 1010 L 361 1010 L 361 886 L 387 886" fill="none" stroke="#7651ac" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 664 924 L 664 961" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="421" y="955" font-size="17" fill="#536579" font-weight="400" text-anchor="start">handshake_plugin_</text>
<rect x="392" y="968" width="296" height="118" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="392" y="980" width="5" height="94" rx="2" fill="#7651ac"/>
<text x="412" y="1001" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">SocketHandShakePlugin</text>
<text x="412" y="1031" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Implements HandShakePlugin</text>
<text x="412" y="1058" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Separate P2P listener</text>
<path d="M 184 1091 L 184 1140" fill="none" stroke="#b35a13" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="1147" width="300" height="138" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="1159" width="5" height="114" rx="2" fill="#b35a13"/>
<text x="52" y="1180" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">TcpContext</text>
<text x="52" y="1210" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">io_context: event-loop state</text>
<text x="52" y="1237" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">acceptor: new connections</text>
<text x="52" y="1264" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">validate_addr_: range check</text>
<text x="394" y="1182" font-size="19" fill="#15283f" font-weight="700" text-anchor="start">Solid: member relationship</text>
<text x="394" y="1215" font-size="19" fill="#7651ac" font-weight="700" text-anchor="start">Dashed: shared metadata</text>
<text x="394" y="1248" font-size="19" fill="#536579" font-weight="400" text-anchor="start">Arrows do not imply</text>
<text x="394" y="1274" font-size="19" fill="#536579" font-weight="400" text-anchor="start">one thread per object.</text>
<text x="360" y="1335" font-size="21" fill="#15283f" font-weight="700" text-anchor="middle">Transfer metadata describes memory; the master tracks keys.</text>
<text x="32" y="1370" font-size="12" fill="#536579" font-weight="700" text-anchor="start">MOONCAKE  /  SOURCE WALKTHROUGH</text>
</g></svg>
