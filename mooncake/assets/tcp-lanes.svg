<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1200" viewBox="0 0 960 1200" role="img" aria-labelledby="title desc">
<title id="title">One peer group, several TCP connections</title><desc id="desc">Caller objects → TCP connections → owner sessions · two lanes shown</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="960" height="1200" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="27" fill="#15283f" font-weight="700" text-anchor="start">One peer group, several TCP connections</text>
<text x="32" y="75" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Caller objects → TCP connections → owner sessions · two lanes shown</text>
<rect x="32" y="110" width="896" height="715" rx="14" fill="#eaf3ff" stroke="#2563b0" stroke-width="2"/>
<text x="54" y="145" font-size="25" fill="#2563b0" font-weight="700" text-anchor="start">CALLER: PeerConnectionGroup</text>
<text x="56" y="178" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">key = owner host + data port D     |     lanes = vector of lane pointers</text>
<rect x="192" y="210" width="576" height="88" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="192" y="222" width="5" height="64" rx="2" fill="#2563b0"/>
<text x="212" y="243" font-size="22" fill="#2563b0" font-weight="700" text-anchor="start">queue: waiting TcpWorkItem objects</text>
<text x="212" y="273" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Work C waits while A and B are active below.</text>
<path d="M 480 303 L 480 329" fill="none" stroke="#2563b0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="480" y="357" font-size="22" fill="#2563b0" font-weight="700" text-anchor="middle">runGroupPump() assigns work to available lanes</text>
<path d="M 365 373 L 269 408" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 595 373 L 691 408" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="415" width="410" height="379" rx="14" fill="#e7f4f0" stroke="#087f78" stroke-width="2"/>
<text x="86" y="450" font-size="25" fill="#087f78" font-weight="700" text-anchor="start">ConnectionLane 0</text>
<text x="86" y="481" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">current = work A     state = BUSY</text>
<rect x="84" y="504" width="370" height="88" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="84" y="516" width="5" height="64" rx="2" fill="#087f78"/>
<text x="104" y="537" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">session → ClientSession</text>
<text x="104" y="567" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Runs this work item’s transfer.</text>
<path d="M 269 597 L 269 654" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="285" y="631" font-size="18" fill="#087f78" font-weight="400" text-anchor="start">socket_</text>
<rect x="84" y="661" width="370" height="108" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="84" y="673" width="5" height="84" rx="2" fill="#b35a13"/>
<text x="104" y="694" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">socket → TCP socket 0</text>
<text x="104" y="724" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Same object as session.socket_</text>
<text x="104" y="751" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">One reusable caller-side socket</text>
<path d="M 269 774 L 269 928" fill="none" stroke="#b35a13" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="285" y="869" font-size="19" fill="#b35a13" font-weight="700" text-anchor="start">Connection 0</text>
<text x="285" y="896" font-size="18" fill="#b35a13" font-weight="400" text-anchor="start">to owner port D</text>
<rect x="486" y="415" width="410" height="379" rx="14" fill="#e7f4f0" stroke="#087f78" stroke-width="2"/>
<text x="508" y="450" font-size="25" fill="#087f78" font-weight="700" text-anchor="start">ConnectionLane 1</text>
<text x="508" y="481" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">current = work B     state = BUSY</text>
<rect x="506" y="504" width="370" height="88" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="506" y="516" width="5" height="64" rx="2" fill="#087f78"/>
<text x="526" y="537" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">session → ClientSession</text>
<text x="526" y="567" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Runs this work item’s transfer.</text>
<path d="M 691 597 L 691 654" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="707" y="631" font-size="18" fill="#087f78" font-weight="400" text-anchor="start">socket_</text>
<rect x="506" y="661" width="370" height="108" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="506" y="673" width="5" height="84" rx="2" fill="#b35a13"/>
<text x="526" y="694" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">socket → TCP socket 1</text>
<text x="526" y="724" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Same object as session.socket_</text>
<text x="526" y="751" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">One reusable caller-side socket</text>
<path d="M 691 774 L 691 928" fill="none" stroke="#b35a13" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="707" y="869" font-size="19" fill="#b35a13" font-weight="700" text-anchor="start">Connection 1</text>
<text x="707" y="896" font-size="18" fill="#b35a13" font-weight="400" text-anchor="start">to owner port D</text>
<rect x="32" y="938" width="896" height="158" rx="14" fill="#f1ebf8" stroke="#7651ac" stroke-width="2"/>
<text x="54" y="973" font-size="25" fill="#7651ac" font-weight="700" text-anchor="start">OWNER: TcpContext::acceptor listens on data port D</text>
<rect x="84" y="982" width="370" height="90" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="84" y="994" width="5" height="66" rx="2" fill="#7651ac"/>
<text x="104" y="1015" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">ServerSession 0</text>
<text x="104" y="1045" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Uses its own accepted socket.</text>
<rect x="506" y="982" width="370" height="90" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="506" y="994" width="5" height="66" rx="2" fill="#7651ac"/>
<text x="526" y="1015" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">ServerSession 1</text>
<text x="526" y="1045" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Uses its own accepted socket.</text>
<text x="480" y="1136" font-size="23" fill="#15283f" font-weight="700" text-anchor="middle">All caller lanes share one io_context and TCP worker.</text>
<text x="480" y="1166" font-size="20" fill="#536579" font-weight="400" text-anchor="middle">Each lane is a connection slot; it does not create a thread.</text>
<text x="32" y="1180" font-size="12" fill="#536579" font-weight="700" text-anchor="start">MOONCAKE  /  SOURCE WALKTHROUGH</text>
</g></svg>
