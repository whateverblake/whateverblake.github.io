<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">One owner pool, three places holding descriptions</title><desc id="desc">TCP + P2PHANDSHAKE · the memory stays in the owner process</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="1200" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="27" fill="#15283f" font-weight="700" text-anchor="start">One owner pool, three places holding descriptions</text>
<text x="32" y="75" font-size="18" fill="#536579" font-weight="400" text-anchor="start">TCP + P2PHANDSHAKE · the memory stays in the owner process</text>
<rect x="24" y="126" width="368" height="711" rx="14" fill="#fff4e8" stroke="#b35a13" stroke-width="2"/>
<text x="46" y="161" font-size="25" fill="#b35a13" font-weight="700" text-anchor="start">OWNER</text>
<rect x="48" y="187" width="320" height="102" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="48" y="199" width="5" height="78" rx="2" fill="#b35a13"/>
<text x="68" y="220" font-size="22" fill="#b35a13" font-weight="700" text-anchor="start">RealClient</text>
<text x="68" y="250" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">segment_ptrs_: backing memory</text>
<text x="68" y="277" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Example: 64 MiB pool</text>
<rect x="48" y="313" width="320" height="137" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="48" y="325" width="5" height="113" rx="2" fill="#087f78"/>
<text x="68" y="346" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">TransferEngineImpl</text>
<text x="68" y="375" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">registering_memory_regions_</text>
<text x="68" y="404" font-size="18" fill="#536579" font-weight="400" text-anchor="start">       ↓ registration succeeds</text>
<text x="68" y="433" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">local_memory_regions_</text>
<rect x="48" y="475" width="320" height="229" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="48" y="487" width="5" height="205" rx="2" fill="#7651ac"/>
<text x="68" y="508" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">TransferMetadata</text>
<text x="68" y="537" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">segment_id_to_desc_map_[0]</text>
<text x="68" y="567" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">→ local SegmentDesc</text>
<text x="68" y="598" font-size="19" fill="#15283f" font-weight="400" text-anchor="start">    buffers[] → BufferDesc</text>
<text x="68" y="629" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">    addr = owner pool base</text>
<text x="68" y="660" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">    length = registered size</text>
<rect x="48" y="715" width="320" height="109" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="48" y="727" width="5" height="85" rx="2" fill="#2563b0"/>
<text x="68" y="748" font-size="22" fill="#2563b0" font-weight="700" text-anchor="start">Client</text>
<text x="68" y="778" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">mounted_segments_</text>
<text x="68" y="805" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">UUID → Segment</text>
<rect x="430" y="126" width="342" height="711" rx="14" fill="#eaf3ff" stroke="#2563b0" stroke-width="2"/>
<text x="452" y="161" font-size="25" fill="#2563b0" font-weight="700" text-anchor="start">MASTER</text>
<rect x="454" y="187" width="294" height="227" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="454" y="199" width="5" height="203" rx="2" fill="#2563b0"/>
<text x="474" y="220" font-size="22" fill="#2563b0" font-weight="700" text-anchor="start">SegmentManager</text>
<text x="474" y="249" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">mounted_segments_[UUID]</text>
<text x="474" y="280" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">→ MountedSegment</text>
<text x="474" y="311" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">    segment: Store Segment</text>
<text x="474" y="342" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">    status: OK</text>
<text x="474" y="373" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">    buf_allocator</text>
<path d="M 601 419 L 601 448" fill="none" stroke="#087f78" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="454" y="455" width="294" height="145" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="454" y="467" width="5" height="121" rx="2" fill="#087f78"/>
<text x="474" y="488" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">OffsetBufferAllocator</text>
<text x="474" y="518" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Free / reserved ranges</text>
<text x="474" y="545" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">within the owner pool</text>
<text x="474" y="572" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Bookkeeping only</text>
<text x="454" y="651" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Store UUID identifies the pool.</text>
<text x="454" y="680" font-size="18" fill="#536579" font-weight="400" text-anchor="start">No SegmentDesc in this record.</text>
<text x="454" y="775" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Also: client / name / host indexes</text>
<rect x="810" y="126" width="366" height="711" rx="14" fill="#e4f4f0" stroke="#087f78" stroke-width="2"/>
<text x="832" y="161" font-size="25" fill="#087f78" font-weight="700" text-anchor="start">REQUESTING CLIENT</text>
<rect x="834" y="187" width="318" height="304" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="834" y="199" width="5" height="280" rx="2" fill="#7651ac"/>
<text x="854" y="220" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">TransferMetadata</text>
<text x="854" y="249" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">segment_name_to_id_map_</text>
<text x="854" y="280" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">owner endpoint → remote ID</text>
<text x="854" y="320" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">segment_id_to_desc_map_</text>
<text x="854" y="351" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">remote ID → SegmentDesc</text>
<text x="854" y="391" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">A decoded copy of the</text>
<text x="854" y="422" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">owner&#x27;s description</text>
<text x="854" y="461" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Example remote ID: 1</text>
<text x="834" y="547" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Fetched on the first cache miss.</text>
<text x="834" y="589" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Not a local memory registration.</text>
<text x="834" y="621" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Not a Store mount by this client.</text>
<text x="834" y="680" font-size="20" fill="#087f78" font-weight="700" text-anchor="start">No copy of the whole pool.</text>
<text x="834" y="775" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Object range comes from master.</text>
<path d="M 208 853 L 208 1110" stroke="#bdcbdc" stroke-width="2" stroke-dasharray="5 7"/>
<path d="M 601 853 L 601 1110" stroke="#bdcbdc" stroke-width="2" stroke-dasharray="5 7"/>
<path d="M 993 853 L 993 1110" stroke="#bdcbdc" stroke-width="2" stroke-dasharray="5 7"/>
<text x="404" y="886" font-size="19" fill="#2563b0" font-weight="400" text-anchor="middle">1  MountSegment: Store Segment</text>
<path d="M 208 904 L 601 904" fill="none" stroke="#2563b0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="797" y="957" font-size="19" fill="#2563b0" font-weight="400" text-anchor="middle">2  PutStart reply: allocated range</text>
<path d="M 601 975 L 993 975" fill="none" stroke="#2563b0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="601" y="1032" font-size="20" fill="#7651ac" font-weight="400" text-anchor="middle">3  Peer fetches via P2P; owner replies with encoded SegmentDesc</text>
<path d="M 208 1050 L 993 1050" fill="none" stroke="#7651ac" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="600" y="1131" font-size="22" fill="#15283f" font-weight="700" text-anchor="middle">Mounting announces capacity. Peer discovery caches metadata. A later WRITE moves bytes.</text>
<text x="32" y="1180" font-size="12" fill="#536579" font-weight="700" text-anchor="start">MOONCAKE  /  SOURCE WALKTHROUGH</text>
</g></svg>
