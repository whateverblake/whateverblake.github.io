<svg xmlns="http://www.w3.org/2000/svg" width="720" height="642" viewBox="0 0 720 642" role="img" aria-labelledby="title desc">
<title id="title">Allocate an offset, not a new pool</title><desc id="desc">Illustrative addresses • 4096-byte object • no extra rounding</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="720" height="642" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="27" fill="#15283f" font-weight="700" text-anchor="start">Allocate an offset, not a new pool</text>
<text x="32" y="75" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Illustrative addresses • 4096-byte object • no extra rounding</text>
<rect x="32" y="112" width="656" height="115" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="124" width="5" height="91" rx="2" fill="#2563b0"/>
<text x="52" y="145" font-size="22" fill="#2563b0" font-weight="700" text-anchor="start">MASTER: allocation bookkeeping</text>
<text x="52" y="175" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Pick a free block; split it; record the replica.</text>
<text x="52" y="202" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Returned address = owner base + byte offset</text>
<path d="M 360 232 L 360 274" fill="none" stroke="#2563b0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="360" y="312" font-size="25" fill="#15283f" font-weight="700" text-anchor="middle">0x70000000 + 0x2000 = 0x70002000</text>
<rect x="32" y="347" width="656" height="194" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="359" width="5" height="170" rx="2" fill="#7651ac"/>
<text x="52" y="380" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">OWNER: existing global memory pool</text>
<rect x="53" y="408" width="180" height="65" fill="#e6edf7" stroke="white" stroke-width="2"/>
<text x="143.0" y="447" font-size="18" fill="#15283f" font-weight="700" text-anchor="middle">Earlier ranges</text>
<rect x="233" y="408" width="207" height="65" fill="#dcd1ed" stroke="white" stroke-width="2"/>
<text x="336.5" y="447" font-size="18" fill="#15283f" font-weight="700" text-anchor="middle">4096 bytes</text>
<rect x="440" y="408" width="228" height="65" fill="#e0f2eb" stroke="white" stroke-width="2"/>
<text x="554.0" y="447" font-size="18" fill="#15283f" font-weight="700" text-anchor="middle">Remaining space</text>
<text x="233" y="505" font-size="20" fill="#7651ac" font-weight="400" text-anchor="start">↑ chosen offset 0x2000</text>
<text x="360" y="590" font-size="21" fill="#536579" font-weight="400" text-anchor="middle">Freeing a block can merge neighboring free ranges.</text>
<text x="32" y="622" font-size="12" fill="#536579" font-weight="700" text-anchor="start">MOONCAKE  /  SOURCE WALKTHROUGH</text>
</g></svg>
