<svg xmlns="http://www.w3.org/2000/svg" width="720" height="570" viewBox="0 0 720 570" role="img" aria-labelledby="title desc">
<title id="title">One cluster, three processes</title><desc id="desc">The master chooses a location. Clients move the bytes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="720" height="570" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="27" fill="#15283f" font-weight="700" text-anchor="start">One cluster, three processes</text>
<text x="32" y="75" font-size="18" fill="#536579" font-weight="400" text-anchor="start">The master chooses a location. Clients move the bytes.</text>
<rect x="204" y="110" width="312" height="102" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="204" y="122" width="5" height="78" rx="2" fill="#2563b0"/>
<text x="224" y="143" font-size="22" fill="#2563b0" font-weight="700" text-anchor="start">MASTER</text>
<text x="224" y="173" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Keys • replicas • free space</text>
<rect x="32" y="346" width="292" height="110" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="32" y="358" width="5" height="86" rx="2" fill="#087f78"/>
<text x="52" y="379" font-size="22" fill="#087f78" font-weight="700" text-anchor="start">CALLER</text>
<text x="52" y="409" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Put / Get API</text>
<text x="52" y="436" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Local staging buffer</text>
<rect x="396" y="346" width="292" height="110" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="396" y="358" width="5" height="86" rx="2" fill="#7651ac"/>
<text x="416" y="379" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">OWNER</text>
<text x="416" y="409" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Mounted memory pool</text>
<text x="416" y="436" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Stores object bytes</text>
<path d="M 170 340 L 270 220" fill="none" stroke="#2563b0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="39" y="258" font-size="20" fill="#2563b0" font-weight="400" text-anchor="start">Placement RPCs</text>
<path d="M 548 340 L 456 220" fill="none" stroke="#2563b0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="496" y="234" font-size="19" fill="#2563b0" font-weight="400" text-anchor="start">Mount + heartbeat</text>
<path d="M 325 330 L 390 330" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 325 387 L 390 387" fill="none" stroke="#b35a13" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="360" y="314" font-size="19" fill="#7651ac" font-weight="400" text-anchor="middle">P2P metadata</text>
<text x="360" y="491" font-size="22" fill="#b35a13" font-weight="700" text-anchor="middle">TCP data: caller → owner on Put</text>
<text x="360" y="520" font-size="20" fill="#536579" font-weight="400" text-anchor="middle">Get returns bytes from owner → caller</text>
<text x="32" y="550" font-size="12" fill="#536579" font-weight="700" text-anchor="start">MOONCAKE  /  SOURCE WALKTHROUGH</text>
</g></svg>
