<svg xmlns="http://www.w3.org/2000/svg" width="720" height="956" viewBox="0 0 720 956" role="img" aria-labelledby="title desc">
<title id="title">Turn a client into an owner</title><desc id="desc">Standalone mooncake_client • TCP • P2PHANDSHAKE</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="720" height="956" rx="20" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="43" font-size="27" fill="#15283f" font-weight="700" text-anchor="start">Turn a client into an owner</text>
<text x="32" y="75" font-size="18" fill="#536579" font-weight="400" text-anchor="start">Standalone mooncake_client • TCP • P2PHANDSHAKE</text>
<rect x="64" y="103" width="592" height="89" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="64" y="115" width="5" height="65" rx="2" fill="#7651ac"/>
<text x="84" y="136" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">01  Create RealClient and Client</text>
<text x="84" y="166" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Prepare process resources and parse settings.</text>
<path d="M 360 194 L 360 217" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="221" width="592" height="89" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="64" y="233" width="5" height="65" rx="2" fill="#7651ac"/>
<text x="84" y="254" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">02  Connect to the Master service</text>
<text x="84" y="284" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Check service version and request storage settings.</text>
<path d="M 360 312 L 360 335" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="339" width="592" height="89" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="64" y="351" width="5" height="65" rx="2" fill="#7651ac"/>
<text x="84" y="372" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">03  Initialize the Transfer Engine</text>
<text x="84" y="402" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Create metadata state and the handshake listener.</text>
<path d="M 360 430 L 360 453" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="457" width="592" height="89" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="64" y="469" width="5" height="65" rx="2" fill="#7651ac"/>
<text x="84" y="490" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">04  Install TCP and create the submitter</text>
<text x="84" y="520" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Start the data listener and I/O worker.</text>
<path d="M 360 548 L 360 571" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="575" width="592" height="89" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="64" y="587" width="5" height="65" rx="2" fill="#7651ac"/>
<text x="84" y="608" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">05  Allocate storage and register it</text>
<text x="84" y="638" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Prepare a global pool; register its address range.</text>
<path d="M 360 666 L 360 689" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="693" width="592" height="89" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="64" y="705" width="5" height="65" rx="2" fill="#7651ac"/>
<text x="84" y="726" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">06  Mount the segment at the master</text>
<text x="84" y="756" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Record capacity and start heartbeat / task polling.</text>
<path d="M 360 784 L 360 807" fill="none" stroke="#7651ac" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="811" width="592" height="89" rx="12" fill="white" stroke="#dce4ee" stroke-width="1.5"/>
<rect x="64" y="823" width="5" height="65" rx="2" fill="#7651ac"/>
<text x="84" y="844" font-size="22" fill="#7651ac" font-weight="700" text-anchor="start">07  Finish standalone service startup</text>
<text x="84" y="874" font-size="20" fill="#15283f" font-weight="400" text-anchor="start">Register client RPC handlers and start that server.</text>
<text x="32" y="936" font-size="12" fill="#536579" font-weight="700" text-anchor="start">MOONCAKE  /  SOURCE WALKTHROUGH</text>
</g></svg>
