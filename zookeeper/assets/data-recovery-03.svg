<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title description"><title id="title">What a snapshot stores for znodes</title><desc id="description">A source-based schema replaces the missing parsed-snapshot screenshot; it is not a binary hex dump.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="710" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">ZOOKEEPER 3.6.2</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">What a snapshot stores for znodes</text>
<rect x="42" y="132" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="160" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">ACL cache</text>
<text x="63" y="185" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Shared ACL definitions referenced by node records</text>
<rect x="42" y="207" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="235" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Path</text>
<text x="63" y="260" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">A node’s full path in the data tree</text>
<rect x="42" y="282" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="310" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">DataNode.data</text>
<text x="63" y="335" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">byte[] — payload</text>
<rect x="42" y="357" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="385" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">DataNode.acl</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Long — ACL cache key</text>
<rect x="42" y="432" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="460" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">DataNode.stat</text>
<text x="63" y="485" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">StatPersisted — transaction IDs, times, versions and owner</text>
<rect x="42" y="507" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="535" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Recovery</text>
<text x="63" y="560" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">DataTree.deserialize reconstructs nodes and parent-child relationships.</text>
<text x="34" y="624" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">A source-based schema replaces the missing parsed-snapshot screenshot; it is not a binary hex dump.</text>
<a href="https://github.com/apache/zookeeper/blob/803c7f1a12f85978cb049af5e4ef23bd8b688715/zookeeper-server/src/main/java/org/apache/zookeeper/server/DataTree.java">
<text x="34" y="688" font-size="13" fill="#2161ad" font-weight="400" text-anchor="start">Source: DataTree.java • ZooKeeper 3.6.2</text>
</a></g></svg>
