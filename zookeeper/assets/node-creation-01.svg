<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title description"><title id="title">Queue a create request on the client</title><desc id="description">Queue a create request on the client</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="780" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">ZOOKEEPER 3.6.2</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Queue a create request on the client</text>
<rect x="42" y="135" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="165" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">01  ZooKeeper.create</text>
<text x="63" y="192" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Build RequestHeader, CreateRequest and the expected response record.</text>
<path d="M 500 217 L 500 239" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="244" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="274" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">02  ClientCnxn.submitRequest</text>
<text x="63" y="301" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Pass the records to queuePacket and wait for completion.</text>
<path d="M 500 326 L 500 348" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="353" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="383" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">03  queuePacket</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Create a Packet and put it in outgoingQueue.</text>
<path d="M 500 435 L 500 457" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="462" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="492" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">04  SendThread / ClientCnxnSocketNIO</text>
<text x="63" y="519" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Assign xid, serialize to ByteBuffer and write the socket.</text>
<path d="M 500 544 L 500 566" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="571" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="601" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">05  pendingQueue</text>
<text x="63" y="628" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Correlate the server’s reply with the waiting request.</text>
