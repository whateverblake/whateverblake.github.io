<text x="63" y="165" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">01  Main class</text>
<text x="63" y="192" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">org.apache.zookeeper.server.ZooKeeperServerMain</text>
<path d="M 500 217 L 500 239" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
