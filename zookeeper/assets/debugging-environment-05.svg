<text x="63" y="274" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">02  Program argument</text>
<text x="63" y="301" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Absolute path to your local zoo.cfg</text>
<path d="M 500 326 L 500 348" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="353" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="383" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">03  Working directory</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Use a local dataDir and a free clientPort from zoo.cfg.</text>
