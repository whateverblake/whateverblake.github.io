<rect x="42" y="462" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="492" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">04  Breakpoints</text>
<text x="63" y="519" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">initializeAndRun → runFromConfig → server startup</text>
