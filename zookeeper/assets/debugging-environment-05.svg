<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="671" viewBox="0 0 1000 671" role="img" aria-labelledby="title description"><title id="title">Configure a standalone debug launch</title><desc id="description">This is a run-configuration guide, not a capture from a debugging run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="671" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">ZOOKEEPER 3.6.2</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Configure a standalone debug launch</text>
