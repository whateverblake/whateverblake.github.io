<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title description"><title id="title">Default session timeout bounds</title><desc id="description">The interval is negotiated with the client; examples are illustrative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="560" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">ZOOKEEPER 3.6.2</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Default session timeout bounds</text>
<rect x="42" y="132" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="160" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">tickTime</text>
<text x="63" y="185" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Base heartbeat interval; example: 2000 ms</text>
<rect x="42" y="207" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="235" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">minSessionTimeout</text>
<text x="63" y="260" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Defaults to 2 × tickTime → 4000 ms</text>
<rect x="42" y="282" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="310" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">maxSessionTimeout</text>
<text x="63" y="335" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Defaults to 20 × tickTime → 40000 ms</text>
<rect x="42" y="357" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="385" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Explicit configuration</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">The defaults apply only when the value is -1.</text>
<text x="34" y="474" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">The interval is negotiated with the client; examples are illustrative.</text>
<a href="https://github.com/apache/zookeeper/blob/803c7f1a12f85978cb049af5e4ef23bd8b688715/zookeeper-server/src/main/java/org/apache/zookeeper/server/ZooKeeperServer.java">
<text x="34" y="538" font-size="13" fill="#2161ad" font-weight="400" text-anchor="start">Source: ZooKeeperServer.java • ZooKeeper 3.6.2</text>
</a></g></svg>
