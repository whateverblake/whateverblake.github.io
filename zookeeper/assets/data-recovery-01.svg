<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img" aria-labelledby="title description"><title id="title">Transaction log and snapshot filenames</title><desc id="description">The suffix does not mean a snapshot contains only zxids strictly smaller than it; snapshots are fuzzy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="635" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">ZOOKEEPER 3.6.2</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Transaction log and snapshot filenames</text>
<rect x="42" y="132" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="160" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">log.100000001</text>
<text x="63" y="185" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Illustrative: log begins with zxid 0x100000001.</text>
<rect x="42" y="207" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="235" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">log.100000080</text>
<text x="63" y="260" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Illustrative: a later transaction log segment.</text>
<rect x="42" y="282" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="310" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">snapshot.10000007f</text>
<text x="63" y="335" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Illustrative: snapshot associated with zxid 0x10000007f.</text>
<rect x="42" y="357" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="385" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">File suffix</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Hexadecimal zxid; these names are examples, not captured output.</text>
<rect x="42" y="432" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="460" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Recovery</text>
<text x="63" y="485" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Restore a usable snapshot, then replay subsequent transaction records.</text>
<text x="34" y="549" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">The suffix does not mean a snapshot contains only zxids strictly smaller than it; snapshots are fuzzy.</text>
<a href="https://github.com/apache/zookeeper/blob/803c7f1a12f85978cb049af5e4ef23bd8b688715/zookeeper-server/src/main/java/org/apache/zookeeper/server/persistence/FileTxnSnapLog.java">
<text x="34" y="613" font-size="13" fill="#2161ad" font-weight="400" text-anchor="start">Source: FileTxnSnapLog.java • ZooKeeper 3.6.2</text>
</a></g></svg>
