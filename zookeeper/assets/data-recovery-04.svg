<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img" aria-labelledby="title description"><title id="title">What a snapshot stores for sessions</title><desc id="description">Field layout from serializeSnapshot / deserializeSnapshot; no session values are invented.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="635" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
