<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="804" viewBox="0 0 1000 804" role="img" aria-labelledby="title description"><title id="title">Register a persistent watch on the server</title><desc id="description">The original article uses persistent addWatch. Ordinary read-operation watches also follow the shared request machinery.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="804" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">ZOOKEEPER 3.6.2</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Register a persistent watch on the server</text>
<rect x="42" y="135" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="165" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">01  Client addWatch request</text>
<text x="63" y="192" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">An addWatch operation carries the path and watch mode.</text>
<path d="M 500 217 L 500 239" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="244" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="274" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">02  Server I/O and admission</text>
<text x="63" y="301" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">processPacket → RequestThrottler → standalone processor chain</text>
<path d="M 500 326 L 500 348" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="353" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="383" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">03  FinalRequestProcessor</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Dispatch OpCode.addWatch.</text>
<path d="M 500 435 L 500 457" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="462" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="492" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">04  DataTree.addWatch</text>
<text x="63" y="519" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Register the connection watcher with the selected watch managers.</text>
<path d="M 500 544 L 500 566" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="571" width="916" height="103" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="601" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">05  Later changes</text>
<text x="63" y="628" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Triggered events are sent on the connection and delivered by the client</text>
<text x="63" y="652" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">EventThread.</text>
<text x="34" y="718" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">The original article uses persistent addWatch. Ordinary read-operation watches also follow the shared request</text>
<text x="34" y="737" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">machinery.</text>
<a href="https://github.com/apache/zookeeper/blob/803c7f1a12f85978cb049af5e4ef23bd8b688715/zookeeper-server/src/main/java/org/apache/zookeeper/server/FinalRequestProcessor.java">
<text x="34" y="782" font-size="13" fill="#2161ad" font-weight="400" text-anchor="start">Source: FinalRequestProcessor.java • ZooKeeper 3.6.2</text>
</a></g></svg>
