<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="671" viewBox="0 0 1000 671" role="img" aria-labelledby="title description"><title id="title">Standalone request processor chain</title><desc id="description">This is the standalone path; quorum mode inserts additional processors.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="671" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">ZOOKEEPER 3.6.2</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Standalone request processor chain</text>
<rect x="42" y="135" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="165" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">01  RequestThrottler</text>
<text x="63" y="192" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Admission and request throttling</text>
<path d="M 500 217 L 500 239" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="244" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="274" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">02  PrepRequestProcessor</text>
<text x="63" y="301" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Validate the operation and build the transaction.</text>
<path d="M 500 326 L 500 348" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="353" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="383" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">03  SyncRequestProcessor</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Append transaction records and flush the log.</text>
<path d="M 500 435 L 500 457" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="462" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="492" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">04  FinalRequestProcessor</text>
<text x="63" y="519" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Apply the transaction to the database; send the client reply.</text>
<text x="34" y="585" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">This is the standalone path; quorum mode inserts additional processors.</text>
