<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="t d"><title id="t">Followers connect to the leader</title><desc id="d">The leader accepts on its quorum port; every connected follower gets its own LearnerHandler thread.</desc><defs><marker id="a-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="a-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/></marker><marker id="a-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="a-bc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/></marker><marker id="a-59636e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/></marker><marker id="a-d1d9e0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d9e0"/></marker></defs><rect width="960" height="390" fill="#ffffff"/><text x="32.0" y="40.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">Followers connect to the leader</text>
<text x="32.0" y="64.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">The leader accepts on its quorum port; every connected follower gets its own LearnerHandler thread.</text>
<rect x="60.0" y="96.0" width="280.0" height="50.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="200.0" y="117.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="600" text-anchor="middle">Leader</text>
<text x="200.0" y="134.2" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="middle">Leader.lead()</text>
<rect x="60.0" y="196.0" width="280.0" height="56.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="200.0" y="220.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="600" text-anchor="middle">LearnerCnxAcceptorHandler</text>
<text x="200.0" y="237.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">accepts follower sockets</text>
<rect x="60.0" y="306.0" width="280.0" height="56.0" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.3"/>
<text x="200.0" y="330.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8250df" font-weight="600" text-anchor="middle">LearnerHandler</text>
<text x="200.0" y="347.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">one thread per follower</text>
<rect x="620.0" y="96.0" width="280.0" height="50.0" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
<text x="760.0" y="117.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a7f37" font-weight="600" text-anchor="middle">Follower</text>
<text x="760.0" y="134.2" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="middle">Follower.followLeader()</text>
<rect x="620.0" y="196.0" width="280.0" height="56.0" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
<text x="760.0" y="220.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a7f37" font-weight="600" text-anchor="middle">LeaderConnector</text>
<text x="760.0" y="237.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">opens the connection</text>
<path d="M 200.0 146.0 L 200.0 196.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#a-0969da)"/>
<path d="M 200.0 252.0 L 200.0 306.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#a-0969da)"/>
<text x="200.0" y="283.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0969da" font-weight="500" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">per accepted socket</text>
<path d="M 760.0 146.0 L 760.0 196.0" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#a-1a7f37)"/>
<path d="M 620.0 224.0 L 340.0 224.0" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#a-bc4c00)"/>
<text x="480.0" y="217.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#bc4c00" font-weight="500" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">TCP connect · quorum port (e.g. 2888)</text>
<path d="M 760.0 252.0 L 760.0 334.0 L 340.0 334.0" fill="none" stroke="#8250df" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-8250df)"/>
<text x="560.0" y="326.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8250df" font-weight="500" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">protocol packets: FOLLOWERINFO, LEADERINFO, …</text></svg>
