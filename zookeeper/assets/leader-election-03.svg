<text x="63" y="310" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Peer 3</text>
<text x="63" y="335" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">SendWorker / RecvWorker pair for peers 1 and 2</text>
