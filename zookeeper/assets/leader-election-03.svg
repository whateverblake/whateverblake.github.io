<rect x="42" y="432" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="460" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Duplicate connection resolution</text>
<text x="63" y="485" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">The larger server ID is responsible for initiating the retained connection.</text>
<rect x="42" y="507" width="916" height="63" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="535" font-size="20" fill="#087e78" font-weight="700" text-anchor="start">Purpose</text>
<text x="63" y="560" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">One retained socket per peer pair; each endpoint handles sending and receiving.</text>
