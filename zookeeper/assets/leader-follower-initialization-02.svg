<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title description"><title id="title">Agree on the new epoch</title><desc id="description">An epoch orders ensemble incarnations; ACKEPOCH also carries the follower’s prior state summary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="780" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">ZOOKEEPER 3.6.2</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Agree on the new epoch</text>
<rect x="42" y="135" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="165" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">01  Follower → Leader: FOLLOWERINFO</text>
<text x="63" y="192" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Send acceptedEpoch, server ID and protocol information.</text>
<path d="M 500 217 L 500 239" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="244" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="274" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">02  Leader.getEpochToPropose</text>
<text x="63" y="301" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Wait for enough connecting followers; propose a new epoch.</text>
<path d="M 500 326 L 500 348" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="353" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="383" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">03  Leader → Follower: LEADERINFO</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Send the proposed epoch.</text>
<path d="M 500 435 L 500 457" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="462" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="492" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">04  Follower → Leader: ACKEPOCH</text>
<text x="63" y="519" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Return the prior currentEpoch and last zxid in the acknowledgement.</text>
<path d="M 500 544 L 500 566" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="571" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="601" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">05  Leader.waitForEpochAck</text>
<text x="63" y="628" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Collect acknowledgements from a quorum before synchronization.</text>
<text x="34" y="694" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">An epoch orders ensemble incarnations; ACKEPOCH also carries the follower’s prior state summary.</text>
<a href="https://github.com/apache/zookeeper/blob/803c7f1a12f85978cb049af5e4ef23bd8b688715/zookeeper-server/src/main/java/org/apache/zookeeper/server/quorum/LearnerHandler.java">
<text x="34" y="758" font-size="13" fill="#2161ad" font-weight="400" text-anchor="start">Source: LearnerHandler.java • ZooKeeper 3.6.2</text>
</a></g></svg>
