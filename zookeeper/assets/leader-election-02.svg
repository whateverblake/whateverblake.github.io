<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">The election loop</title><desc id="d">Each peer votes for itself, then keeps comparing and re-broadcasting until one candidate has a quorum.</desc><defs><marker id="a-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="a-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/></marker><marker id="a-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="a-bc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/></marker><marker id="a-59636e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/></marker><marker id="a-d1d9e0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d9e0"/></marker></defs><rect width="960" height="600" fill="#ffffff"/><text x="32.0" y="40.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">The election loop</text>
<text x="32.0" y="64.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start">Each peer votes for itself, then keeps comparing and re-broadcasting until one candidate has a quorum.</text>
<rect x="330.0" y="86.0" width="300.0" height="40.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="480.0" y="110.7" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="600" text-anchor="middle">ZAB state = ELECTION</text>
<rect x="330.0" y="146.0" width="300.0" height="48.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="480.0" y="166.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="600" text-anchor="middle">vote for itself</text>
<text x="480.0" y="183.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">(sid, zxid, peerEpoch)</text>
<rect x="330.0" y="214.0" width="300.0" height="48.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="480.0" y="234.2" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0969da" font-weight="600" text-anchor="middle">sendNotifications()</text>
<text x="480.0" y="251.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">to all voters</text>
<path d="M 480.0 126.0 L 480.0 146.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#a-0969da)"/>
<path d="M 480.0 194.0 L 480.0 214.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#a-0969da)"/>
<rect x="40.0" y="284.0" width="880.0" height="282.0" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="54.0" y="306.0" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0969da" font-weight="700" text-anchor="start">lookForLeader() loop</text>
<rect x="70.0" y="350.0" width="220.0" height="54.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="180.0" y="373.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="600" text-anchor="middle">take r_vote</text>
<text x="180.0" y="390.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">from recvqueue</text>
<polygon points="480,339.0 590.0,377 480,415.0 370.0,377" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="480.0" y="373.8" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="500" text-anchor="middle">r_vote better?</text>
<text x="480.0" y="389.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="500" text-anchor="middle">(peerEpoch, zxid, sid)</text>
<rect x="670.0" y="350.0" width="220.0" height="54.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="780.0" y="373.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="600" text-anchor="middle">adopt r_vote</text>
<text x="780.0" y="390.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">and broadcast again</text>
<rect x="670.0" y="470.0" width="220.0" height="54.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="780.0" y="501.7" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="600" text-anchor="middle">put r_vote in recvset</text>
<polygon points="480,459.0 590.0,497 480,535.0 370.0,497" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="480.0" y="493.8" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="500" text-anchor="middle">voteTracker:</text>
<text x="480.0" y="509.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="500" text-anchor="middle">quorum on our vote?</text>
<rect x="70.0" y="470.0" width="220.0" height="54.0" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
<text x="180.0" y="493.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a7f37" font-weight="600" text-anchor="middle">leave the loop</text>
<text x="180.0" y="510.2" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle">LEADING / FOLLOWING</text>
