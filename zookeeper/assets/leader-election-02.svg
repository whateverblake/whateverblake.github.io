<text x="552.0" y="424.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0969da" font-weight="500" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">no</text>
<path d="M 670.0 497.0 L 590.0 497.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#a-0969da)"/>
