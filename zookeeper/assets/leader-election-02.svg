<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="889" viewBox="0 0 1000 889" role="img" aria-labelledby="title description"><title id="title">Fast leader election: propose, compare, converge</title><desc id="description">Fast leader election: propose, compare, converge</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2161ad"/></marker></defs><rect width="1000" height="889" rx="16" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="38" font-size="13" fill="#54677d" font-weight="700" text-anchor="start">ZOOKEEPER 3.6.2</text>
<text x="34" y="77" font-size="27" fill="#182a42" font-weight="700" text-anchor="start">Fast leader election: propose, compare, converge</text>
<rect x="42" y="135" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="165" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">01  Enter LOOKING</text>
<text x="63" y="192" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Increment logicalclock and initialize the proposal.</text>
<path d="M 500 217 L 500 239" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="244" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="274" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">02  sendNotifications</text>
<text x="63" y="301" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Broadcast the currently proposed leader.</text>
<path d="M 500 326 L 500 348" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="353" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="383" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">03  Read the next vote</text>
<text x="63" y="410" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Compare election epoch, peer epoch, zxid and server ID as appropriate.</text>
<path d="M 500 435 L 500 457" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="462" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="492" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">04  Update proposal when needed</text>
<text x="63" y="519" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Broadcast the better proposal and retain eligible received votes.</text>
<path d="M 500 544 L 500 566" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="571" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="601" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">05  Quorum decision</text>
<text x="63" y="628" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Check enough matching votes and the finalization conditions.</text>
<path d="M 500 653 L 500 675" stroke="#2161ad" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="42" y="680" width="916" height="79" rx="10" fill="white" stroke="#d5dfeb"/>
<text x="63" y="710" font-size="20" fill="#2161ad" font-weight="700" text-anchor="start">06  Leave LOOKING</text>
<text x="63" y="737" font-size="18" fill="#182a42" font-weight="400" text-anchor="start">Become LEADING or FOLLOWING; return the agreed Vote.</text>
<text x="34" y="803" font-size="14" fill="#54677d" font-weight="400" text-anchor="start">English explanatory reconstruction from the named source.</text>
<a href="https://github.com/apache/zookeeper/blob/803c7f1a12f85978cb049af5e4ef23bd8b688715/zookeeper-server/src/main/java/org/apache/zookeeper/server/quorum/FastLeaderElection.java">
<text x="34" y="867" font-size="13" fill="#2161ad" font-weight="400" text-anchor="start">Source: FastLeaderElection.java • ZooKeeper 3.6.2</text>
</a></g></svg>
