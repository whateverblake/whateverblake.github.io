<text x="300.0" y="548.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="500" text-anchor="start">no: read the next vote</text></svg>
