<text x="630.0" y="370.0" font-family="IBM Plex Sans, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0969da" font-weight="500" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">yes</text>
<path d="M 780.0 404.0 L 780.0 470.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#a-0969da)"/>
